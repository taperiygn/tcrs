steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/tcrs-backend/tcrs-backend
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/tcrs-backend/tcrs-backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tcrs-backend
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/tcrs-backend/tcrs-backend
      - --region=asia-southeast1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=HOST=0.0.0.0,TCRS_ALLOWED_ORIGINS=https://taperiygn.github.io,TCRS_TRUST_PROXY=1
      - --set-secrets=TCRS_PASSWORD=tcrs-password:latest