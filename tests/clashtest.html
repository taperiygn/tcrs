<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>bus clash test</title>
<style>.toast,.bgwash{display:none}body{background:#fff;margin:0}</style>
<link rel="stylesheet" href="../styles.css">
<script src="../vendor/exceljs.min.js"></script>
<script src="../parser.js"></script>
<script src="../clash.js"></script>
</head><body>
<pre id="test-out">starting…</pre>
<script>
/* Bus-clash verification: part A exercises the pure fleet simulation
   (TCRSClash.analyze) against hand-built days; part B drives the real app
   with a Troop Lift sheet and checks the live "Bus planner" tab. */
(async function () {
  var out = [], failures = 0;
  function ok(name, cond, extra) {
    out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : '  [' + (extra === undefined ? '' : extra) + ']'));
    if (!cond) failures++;
  }
  function log() { document.getElementById('test-out').textContent = out.join('\n'); }
  function txt(el) { return el ? el.textContent : ''; }
  var C = window.TCRSClash, A;

  function mk(date, time, from, to, qty) {
    return { id: 'x' + Math.random(), kind: 'bus', date: date, timeStart: time,
      from: from, to: to, qty: qty, activity: 'TEST', coys: ['4TH'] };
  }
  function sev(flags) { return flags.map(function (f) { return f.severity; }).join(','); }
  var D = '2026-11-23';

  /* ---------- part A: the simulation ---------- */
  try {
    ok('module loaded', !!C && typeof C.analyze === 'function');

    var r = C.analyze([mk(D, '0700', 'MTL', 'RHC', 4), mk(D, '0730', 'RHC', 'MTL', 4)]);
    ok('back-to-back shuttle with a 30-min gap is clean',
      r.flags.length === 0 && r.checked === 2, JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'MTL', 'RHC', 4), mk(D, '0820', 'MTL', 'RHC', 4)]);
    ok('two full-fleet MTL→RHC 20 min apart is a clash (buses back 0830)',
      sev(r.flags) === 'red', JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'MTL', 'RHC', 4), mk(D, '0828', 'MTL', 'RHC', 4)]);
    ok('2 min short is orange (drive-fast grace)',
      sev(r.flags) === 'orange', JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'MTL', 'RHC', 4), mk(D, '0835', 'MTL', 'RHC', 4)]);
    ok('35 min apart is clean', r.flags.length === 0, JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'MTL', 'RHC', 5)]);
    ok('asking for 5 buses is a clash', sev(r.flags) === 'red' && /5 buses/.test(r.flags[0].msg),
      JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'MTL', 'RHC', null), mk(D, '0830', 'MTL', 'RHC', 4)]);
    ok('missing bus count is red and the trip is not simulated',
      sev(r.flags) === 'red' && /missing/.test(r.flags[0].msg) && r.checked === 2,
      JSON.stringify(r.flags) + ' checked=' + r.checked);

    r = C.analyze([mk(D, '0800', 'MTL', 'RHC', 0)]);
    ok('a zero bus count is treated as missing too', sev(r.flags) === 'red' && /missing/.test(r.flags[0].msg),
      JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0645', 'MTL', 'RHC', 4)]);
    ok('pre-0700 start is flagged for permission', sev(r.flags) === 'perm', JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'S1', '163SQN', 4)]);
    ok('unknown route is skipped and counted', r.flags.length === 0 && r.unchecked === 1,
      'unchecked=' + r.unchecked);

    r = C.analyze([
      mk(D, '0800', 'RHC', 'hg rangle', 1),
      mk(D, '0900', 'RHC', 'FC SITE  6', 1),
      mk(D, '1000', 'RHC', '100M RANGE 2', 1)]);
    ok('location typos and variants normalise into the table',
      r.unchecked === 0 && r.flags.length === 0, 'unchecked=' + r.unchecked);

    r = C.analyze([mk(D, '0800', 'RHC', 'HG RANGE', 2), mk(D, '0900', '100M RANGE', 'RHC', 2)]);
    ok('bus dropped at HG RANGE is positioned at 100M RANGE (aliases)',
      r.unchecked === 0 && r.flags.length === 0,
      JSON.stringify(r.flags) + ' unchecked=' + r.unchecked);

    r = C.analyze([mk(D, '0800', 'MTL', 'BIC RANGE', 4)]);
    ok('MTL-BIC RANGE now checked from the matrix (15 min)',
      r.unchecked === 0 && r.flags.length === 0 && r.checked === 1, JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'RHC', 'CCP 3', 1)]);
    ok('CCP 3 resolves to FC SITE 2 (20 min from RHC)',
      r.unchecked === 0 && r.flags.length === 0, 'unchecked=' + r.unchecked);

    ok('RHC-FC SITE 6 is 20 min per the matrix', C.tripMinutes('RHC', 'FC SITE 6') === 20,
      C.tripMinutes('RHC', 'FC SITE 6'));
    ok('MTL-FC SITE 1 is 5 min', C.tripMinutes('MTL', 'FC SITE 1') === 5,
      C.tripMinutes('MTL', 'FC SITE 1'));
    ok('same place under two names is a 0-min trip',
      C.tripMinutes('HG RANGE', '100M RANGE') === 0 && C.tripMinutes('CCP 6', '100M RANGE') === 0,
      C.tripMinutes('HG RANGE', '100M RANGE') + '/' + C.tripMinutes('CCP 6', '100M RANGE'));
    ok('RHC-S1 hand timing kept', C.tripMinutes('RHC', 'S1') === 15, C.tripMinutes('RHC', 'S1'));

    r = C.analyze([mk(D, '2359', '100M RANGE', 'MTL', 4)]);
    ok('2359 trip is late-night activation — skipped, not flagged',
      r.flags.length === 0 && r.activation === 1 && r.checked === 0,
      JSON.stringify(r.flags) + ' act=' + r.activation);

    r = C.analyze([mk(D, 'TBC', 'MTL', 'RHC', 4)]);
    ok('TBC-time trip is activation too', r.flags.length === 0 && r.activation === 1 && r.unchecked === 0,
      JSON.stringify(r.flags) + ' act=' + r.activation);

    r = C.analyze([mk(D, '2300', 'MTL', 'RHC', 4)]);
    ok('2300 trip is still checked', r.checked === 1 && r.flags.length === 0 && r.activation === 0,
      JSON.stringify(r.flags));

    r = C.analyze([
      mk(D, '0700', 'RHC', 'MTL', 1),
      mk(D, '0710', 'RHC', 'MTL', 1),
      mk(D, '0720', 'RHC', 'MTL', 1),
      mk(D, '0730', 'RHC', 'MTL', 1),
      mk(D, '0900', 'S1', 'RHC', 1)]);
    ok('trip needing an unknown deadhead is skipped and counted, not red',
      r.flags.length === 0 && r.unchecked === 1 && r.checked === 5,
      JSON.stringify(r.flags) + ' unchecked=' + r.unchecked + ' checked=' + r.checked);

    r = C.analyze([mk(D, '0800', 'RHC', 'S1', 1), mk(D, '0900', 'S1', 'RHC', 1)]);
    ok('bus dropped at S1 by a checked trip is positioned there',
      r.flags.length === 0 && r.unchecked === 0 && r.checked === 2,
      JSON.stringify(r.flags) + ' unchecked=' + r.unchecked);

    r = C.analyze([mk(D, '0700', 'S1', 'RHC', 4)]);
    ok('first trip of the day may start anywhere', r.flags.length === 0, JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0700', 'MTL', 'RHC', 4), mk(D, '0700', 'S1', 'RHC', 1)]);
    ok('simultaneous trips needing 5 buses is a clash', sev(r.flags) === 'red', JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'MTL', 'RHC', 4), mk(D, '0810', 'RHC', '100M RANGE', 4)]);
    ok('bus already at the origin but arriving 5 min late is orange',
      sev(r.flags) === 'orange', JSON.stringify(r.flags));

    r = C.analyze([mk(D, '0800', 'MTL', 'RHC', 4), mk(D, '0815', 'RHC', '100M RANGE', 4)]);
    ok('bus at the origin right on time is clean', r.flags.length === 0, JSON.stringify(r.flags));
  } catch (e) {
    failures++;
    out.push('CRASH(A) ' + (e && e.stack || e));
  }

  /* ---------- part B: the live tab ---------- */
  try {
    var html = await fetch('../index.html').then(function (r0) { return r0.text(); });
    var doc = new DOMParser().parseFromString(html, 'text/html');
    document.body.appendChild(doc.querySelector('header'));
    document.body.appendChild(doc.querySelector('main'));
    document.body.appendChild(doc.querySelector('.toast'));

    window.__TCRS_TEST_MODE = true;
    eval(await fetch('../app.js').then(function (r0) { return r0.text(); }));
    eval(await fetch('../sheet.js').then(function (r0) { return r0.text(); }));
    A = window.__tcrs;
    localStorage.clear();

    var iw = new ExcelJS.Workbook();
    var ws = iw.addWorksheet('NOVEMBER');
    ws.getRow(1).values = [, 'Resource', , , 'Execution Time', , , , 'Location', , 'POC Details', , ,];
    ws.getRow(2).values = [, 'Type of Veh', 'Qty', 'Required TO', 'Start', , 'End', , 'Reporting', 'Destination', 'Conducting Officer', 'Contact No.', 'Unit', 'Remarks'];
    ws.getRow(3).values = ['SCH 4 - 4TH COY - RANGE DETAIL', 'LUV', 1, 1, '23/11/26', '08:00', '23/11/26', '09:00', 'RHC', 'HG RANGE', '3WO TEST', '84980951', 'SCH 4', ''];

    var tw = new ExcelJS.Workbook();
    var tws = tw.addWorksheet('NOVEMBER TL');
    var lines = [
      'NOVEMBER TL',
      '23/11',
      '0645 MTL - RHC 1 BUSES (4TH EARLY MOVE)',
      '0800 MTL - RHC 4 BUSES (4TH FIRST TRIP)',
      '0820 MTL - RHC 4 BUSES (4TH SECOND TRIP)',
      '0900 MTL - BIC RANGE 4 BUSES (4TH BIC TRIP)',
      '0930 S1 - 163SQN 1 BUSES (4TH S1 TRIP)',
      '2359 100M RANGE - MTL 4 BUSES (4TH NIGHT ACTIVATION)'
    ];
    lines.forEach(function (t, i) { tws.getRow(3 + i).getCell(1).value = t; });

    async function toFile(wb, name) { return new File([await wb.xlsx.writeBuffer()], name); }
    await A.handleFile(await toFile(iw, 'icrf.xlsx'), 'icrf');
    await A.handleFile(await toFile(tw, 'troop lift.xlsx'), 'tl');
    ok('model built from workbooks', !!A.state.model);

    A.setTab('grid');
    A.setSrc('plan');
    ok('planner tab opens', document.getElementById('btn-src-planner').classList.contains('on') &&
      document.getElementById('planner-container').style.display === '');
    ok('planner tab scrolls vertically',
      getComputedStyle(document.getElementById('planner-container')).overflowY === 'auto',
      getComputedStyle(document.getElementById('planner-container')).overflowY);
    ok('tab button shows no clash count — the preview auto-spaces',
      txt(document.getElementById('btn-src-planner')).indexOf('·') === -1,
      txt(document.getElementById('btn-src-planner')));
    ok('every trip of the day is listed, clean ones included',
      document.querySelectorAll('#planner-container .plan-row').length === 6,
      'rows=' + document.querySelectorAll('#planner-container .plan-row').length);
    ok('the clashing 0820 trip is auto-spaced to 0830 in the preview',
      document.querySelectorAll('#planner-container .plan-row.plan-moved').length === 1 &&
      /0830/.test(txt(document.querySelector('#planner-container .plan-row.plan-moved'))) &&
      /0820/.test(txt(document.querySelector('#planner-container .plan-row.plan-moved'))),
      txt(document.querySelector('#planner-container .plan-row.plan-moved')));
    ok('pre-0700 trip flagged for permission',
      document.querySelectorAll('#planner-container .clash-item.sev-perm').length === 1);
    ok('unknown route shown as SKIP row',
      document.querySelectorAll('#planner-container .clash-item.sev-skip').length === 1);
    ok('2359 trip shown as locked activation row',
      document.querySelectorAll('#planner-container .clash-item.sev-activation').length === 1 &&
      document.querySelector('#planner-container .clash-item.sev-activation').classList.contains('plan-locked'));
    ok('day picker offers the planned day', /MON 23\/11\/26/.test(txt(document.getElementById('plan-day'))),
      txt(document.getElementById('plan-day')));

    /* editing the TL text re-checks live: push the second trip past 0835 */
    var t = A.tlText().replace('0820 MTL - RHC 4 BUSES', '0830 MTL - RHC 4 BUSES');
    A.applyTLText(t);
    ok('fixing the time clears the clash live — nothing needs moving any more',
      document.querySelectorAll('#planner-container .plan-row.plan-moved').length === 0 &&
      txt(document.getElementById('btn-src-planner')).indexOf('·') === -1,
      txt(document.getElementById('btn-src-planner')));

    localStorage.clear();
  } catch (e) {
    failures++;
    out.push('CRASH(B) ' + (e && e.stack || e));
  }
  log();
  document.title = failures ? 'CLASH FAILED' : 'CLASH OK';
})();
</script></body></html>
