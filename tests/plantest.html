<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>bus planner test</title>
<style>.toast,.bgwash{display:none}body{background:#fff;margin:0}</style>
<link rel="stylesheet" href="../styles.css">
<script src="../vendor/exceljs.min.js"></script>
<script src="../parser.js"></script>
<script src="../clash.js"></script>
</head><body>
<pre id="test-out">starting…</pre>
<script>
/* Bus-planner verification: part A exercises the pure respace() engine
   (minimal-fix semantics, drag adoption, locked activation trips);
   part B drives the real app — drag reorder, Save draft, Submit plan
   and Discard — against a Troop Lift sheet. */
(async function () {
  var out = [], failures = 0;
  function ok(name, cond, extra) {
    out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : '  [' + (extra === undefined ? '' : extra) + ']'));
    if (!cond) failures++;
  }
  function log() { document.getElementById('test-out').textContent = out.join('\n'); }
  function txt(el) { return el ? el.textContent : ''; }
  var C = window.TCRSClash, A;
  var D = '2026-11-23';

  function mk(id, time, from, to, qty, lock) {
    return { id: id, timeStart: time, from: from, to: to, qty: qty, lock: !!lock };
  }
  function times(r) { return r.plan.map(function (p) { return p.time; }).join(','); }
  function moved(r) { return r.plan.map(function (p) { return p.moved ? 'M' : '.'; }).join(''); }

  /* ---------- part A: the respace engine ---------- */
  try {
    ok('module loaded', !!C && typeof C.respace === 'function' && typeof C.toMin === 'function');

    var r = C.respace([mk('a', '0800', 'MTL', 'RHC', 4), mk('b', '0900', 'RHC', 'MTL', 4)]);
    ok('feasible entered times are kept (minimal fix)',
      times(r) === '0800,0900' && moved(r) === '..' && r.skipped.length === 0, times(r) + ' ' + moved(r));

    r = C.respace([mk('a', '0800', 'MTL', 'RHC', 4), mk('b', '0820', 'MTL', 'RHC', 4)]);
    ok('a clashing trip is pushed to the earliest feasible slot',
      times(r) === '0800,0830' && moved(r) === '.M', times(r) + ' ' + moved(r));

    r = C.respace([mk('b', '0820', 'MTL', 'RHC', 4), mk('a', '0800', 'MTL', 'RHC', 4)], { drag: 'b' });
    ok('the dragged trip adopts its new slot (0700 earliest)',
      times(r) === '0700,0800' && moved(r) === 'M.', times(r) + ' ' + moved(r));

    r = C.respace([mk('b', '0900', 'RHC', 'MTL', 4), mk('a', '0800', 'MTL', 'RHC', 4)]);
    ok('a trip moved later is pushed to when its buses can physically be there',
      times(r) === '0900,0915' && moved(r) === '.M', times(r) + ' ' + moved(r));

    r = C.respace([mk('a', '0630', 'MTL', 'RHC', 4)]);
    ok('a sanctioned pre-0700 trip keeps its time',
      times(r) === '0630' && moved(r) === '.', times(r) + ' ' + moved(r));

    r = C.respace([mk('a', '0800', 'RHC', 'HG RANGE', 4), mk('b', '0810', '100M RANGE', 'RHC', 4)]);
    ok('same place under two names is a 0-min turnaround',
      times(r) === '0800,0810' && moved(r) === '..', times(r) + ' ' + moved(r));

    r = C.respace([
      mk('a', '0700', 'RHC', 'MTL', 1), mk('b', '0700', 'RHC', 'MTL', 1),
      mk('c', '0700', 'RHC', 'MTL', 1), mk('d', '0700', 'RHC', 'MTL', 1),
      mk('e', '0900', 'S1', 'RHC', 1), mk('f', '0730', 'MTL', 'RHC', 4)]);
    ok('a trip needing an unknown deadhead is transparent (skipped, no bus used)',
      times(r) === '0700,0700,0700,0700,0900,0730' && moved(r) === '......' &&
      r.skipped.indexOf('e') > -1 && r.skipped.length === 1,
      times(r) + ' ' + moved(r) + ' skipped=' + r.skipped.join(','));

    r = C.respace([
      mk('a', '0800', 'MTL', 'RHC', 4),
      mk('n', '2359', '100M RANGE', 'MTL', 4, true),
      mk('b', '0830', 'RHC', 'MTL', 4)]);
    ok('a locked 2359 trip keeps its time and consumes no buses',
      times(r) === '0800,2359,0830' && r.skipped.indexOf('n') > -1, times(r) + ' skipped=' + r.skipped.join(','));

    r = C.respace([mk('a', '0800', 'MTL', 'RHC', 4), mk('b', '0820', 'MTL', 'RHC', 9)]);
    ok('a trip asking for more buses than the fleet is transparent',
      times(r) === '0800,0820' && r.skipped.indexOf('b') > -1, times(r) + ' skipped=' + r.skipped.join(','));

    r = C.respace([mk('a', 'TBC', 'MTL', 'RHC', 4), mk('b', '0800', 'RHC', 'MTL', 4)]);
    ok('a TBC trip is transparent and does not constrain the day',
      times(r) === 'TBC,0800' && r.skipped.indexOf('a') > -1, times(r) + ' skipped=' + r.skipped.join(','));
  } catch (e) {
    failures++;
    out.push('CRASH(A) ' + (e && e.stack || e));
  }

  /* ---------- part A2: the parser — troop lift formats ---------- */
  try {
    var T = window.TCRS;
    function stubIcrf() {
      var wb = new ExcelJS.Workbook();
      wb.addWorksheet('NOVEMBER');
      return { worksheets: [wb.worksheets[0]] };
    }

    /* the columnar TEKONG layout: DATE is a shared formula whose cached
       result ExcelJS returns as an Invalid Date / NaN — the DAY column
       plus the "DECEMBER-2026" header text must rebuild the date */
    var wbc = new ExcelJS.Workbook();
    var wsc = wbc.addWorksheet('DEC 26 TL');
    wsc.getRow(1).getCell(11).value = 'DECEMBER-2026';
    wsc.getRow(3).values = [, 'DATE', 'DAY', 'DAY OF WEEK', 'TIME', 'TIME GAP (H:MM)', 'COY/UNIT', 'PURPOSE', 'PICK-UP POINT TO DROP-OFF POINT', 'NO. OF BUSES', 'REMARKS'];
    wsc.getRow(4).values = [, { formula: 'B4&"-"&$K$1', result: new Date('zzz') }, 1, 'Tuesday', '0630', , '1ST', 'COMD VETT', 'RHC - MTL', 4, '4x 5-TON'];
    wsc.getRow(5).values = [, { formula: 'B5&"-"&$K$1', result: NaN }, 1, 'Tuesday', '0700', , '4TH', 'COMD VETT', 'RHC - MTL', 4, ''];
    wsc.getRow(6).values = [, , 2, 'Wednesday', '1700', , '5TH', 'GX II', 'MTL - RHC', 2, '2x 5-TON'];
    wsc.getRow(7).values = [, '-DECEMBER-2026', , , , , , , , ];
    var mc = T.parseWorkbooks(stubIcrf(), wbc, 4);
    var tlc = mc.entries.filter(function (e) { return e.source === 'TROOPLIFT'; });
    ok('columnar TL detected — 5 movements (3 buses + 2 tonners)',
      tlc.length === 5 && tlc.filter(function (e) { return e.vehicleType === 'TONNERS'; }).length === 2,
      tlc.length);
    ok('dates rebuilt from DAY column when DATE formulas are uncached',
      tlc.every(function (e) { return e.date === '2026-12-01' || e.date === '2026-12-02'; }),
      tlc.map(function (e) { return e.date; }).join(','));
    var first = tlc[0];
    ok('time/from/to/qty/coys/activity parsed from the columns',
      first.timeStart === '0630' && first.from === 'RHC' && first.to === 'MTL' &&
      first.qty === 4 && first.coys[0] === '1ST' && first.activity === 'COMD VETT',
      JSON.stringify([first.timeStart, first.from, first.to, first.qty, first.coys, first.activity]));
    ok('remark "4x 5-TON" emits a same-slot tonner movement',
      tlc.some(function (e) {
        return e.vehicleType === 'TONNERS' && e.qty === 4 && e.timeStart === '0630' &&
          e.coys[0] === '1ST' && e.date === '2026-12-01';
      }));
    ok('junk placeholder rows skipped, not unmatched',
      (mc.tlUnmatched || []).length === 0, JSON.stringify(mc.tlUnmatched));
    ok('columnar month/year derived',
      mc.monthName === 'DECEMBER' && mc.year === 2026, mc.monthName + ' ' + mc.year);

    /* the free-text template keeps parsing exactly as before */
    var wbt = new ExcelJS.Workbook();
    var wst = wbt.addWorksheet('NOVEMBER TL');
    wst.getRow(1).values = ['NOVEMBER TL'];
    wst.getRow(2).getCell(1).value = new Date(Date.UTC(2026, 10, 23));
    wst.getRow(3).getCell(1).value = '0800 MTL - RHC 4 BUSES (4TH FIRST)';
    wst.getRow(4).getCell(1).value = '23/11 (*TBC*)';
    wst.getRow(5).getCell(1).value = '0915 RHC - MTL TONNERS (5TH GX RTU)';
    var mt = T.parseWorkbooks(stubIcrf(), wbt, 4);
    var tlt = mt.entries.filter(function (e) { return e.source === 'TROOPLIFT'; });
    ok('free-text TL still parses (2 lines, right tags)',
      tlt.length === 2 && tlt[0].timeStart === '0800' && tlt[0].coys[0] === '4TH' &&
      tlt[0].activity === 'FIRST' && tlt[1].coys[0] === '5TH' && tlt[1].activity === 'GX RTU',
      JSON.stringify(tlt.map(function (e) { return [e.timeStart, e.coys, e.activity]; })));
    ok('free-text month/day still work',
      mt.monthName === 'NOVEMBER' && tlt[0].date === '2026-11-23',
      mt.monthName + ' ' + (tlt[0] && tlt[0].date));
  } catch (e) {
    failures++;
    out.push('CRASH(A2) ' + (e && e.stack || e));
  }

  /* ---------- part B: the live planner tab ---------- */
  try {
    var html = await fetch('../index.html').then(function (r0) { return r0.text(); });
    var doc = new DOMParser().parseFromString(html, 'text/html');
    document.body.appendChild(doc.querySelector('header'));
    document.body.appendChild(doc.querySelector('main'));
    document.body.appendChild(doc.querySelector('.toast'));

    window.__TCRS_TEST_MODE = true;
    eval(await fetch('../app.js').then(function (r0) { return r0.text(); }));
    eval(await fetch('../sheet.js').then(function (r0) { return r0.text(); }));
    A = window.__tcrs;

    localStorage.clear();

    var iw = new ExcelJS.Workbook();
    var ws = iw.addWorksheet('NOVEMBER');
    ws.getRow(1).values = [, 'Resource', , , 'Execution Time', , , , 'Location', , 'POC Details', , ,];
    ws.getRow(2).values = [, 'Type of Veh', 'Qty', 'Required TO', 'Start', , 'End', , 'Reporting', 'Destination', 'Conducting Officer', 'Contact No.', 'Unit', 'Remarks'];
    ws.getRow(3).values = ['SCH 4 - 4TH COY - RANGE DETAIL', 'LUV', 1, 1, '23/11/26', '08:00', '23/11/26', '09:00', 'RHC', 'HG RANGE', '3WO TEST', '84980951', 'SCH 4', ''];

    var tw = new ExcelJS.Workbook();
    var tws = tw.addWorksheet('NOVEMBER TL');
    var lines = [
      'NOVEMBER TL',
      '23/11',
      '0800 MTL - RHC 4 BUSES (4TH FIRST)',
      '0820 MTL - RHC 4 BUSES (4TH SECOND)',
      '0900 RHC - MTL 4 BUSES (4TH BACK)',
      '0930 S1 - 163SQN 1 BUSES (4TH S1)',
      '2359 100M RANGE - MTL 4 BUSES (4TH NIGHT)'
    ];
    lines.forEach(function (t, i) { tws.getRow(3 + i).getCell(1).value = t; });
    async function toFile(wb, name) { return new File([await wb.xlsx.writeBuffer()], name); }
    await A.handleFile(await toFile(iw, 'icrf.xlsx'), 'icrf');
    await A.handleFile(await toFile(tw, 'troop lift.xlsx'), 'tl');
    ok('model built from workbooks', !!A.state.model);
    A.setTab('grid');
    A.setSrc('plan');
    var DAY = '2026-11-23';

    ok('planner lists every trip of the day, clean ones included',
      document.querySelectorAll('#planner-container .plan-row').length === 5,
      'rows=' + document.querySelectorAll('#planner-container .plan-row').length);
    ok('unknown route shows as SKIP, 2359 as locked ACTIVATION',
      document.querySelectorAll('#planner-container .clash-item.sev-skip').length === 1 &&
      document.querySelectorAll('#planner-container .clash-item.sev-activation.plan-locked').length === 1);
    ok('auto adjust defaults off', !document.querySelector('#planner-container .plan-auto input').checked);
    ok('no draft yet — Save/Submit/Discard disabled',
      document.getElementById('plan-save').disabled &&
      document.getElementById('plan-submit').disabled &&
      document.getElementById('plan-discard').disabled);

    function rowId(i) {
      return document.querySelectorAll('#planner-container .plan-row')[i].getAttribute('data-id');
    }
    function rowTime(i) {             // the time shown: working plan or entered
      var id = rowId(i);
      var pt = A.state.planTimes[DAY] || {};
      if (pt[id]) return pt[id];
      var e = A.state.entries.filter(function (x) { return x.id === id; })[0];
      return e ? e.timeStart : null;
    }
    function actOf(i) {
      var id = rowId(i);
      var e = A.state.entries.filter(function (x) { return x.id === id; })[0];
      return e ? e.activity : '';
    }

    /* drag with auto adjust OFF: pure reorder, times untouched */
    A.planMove(DAY, rowId(1), rowId(0));
    ok('auto off — drag reorders without touching any time',
      actOf(0) === 'SECOND' && rowTime(0) === '0820' && rowTime(1) === '0800' &&
      document.querySelectorAll('#planner-container .plan-row.plan-moved').length === 0,
      actOf(0) + ' ' + rowTime(0) + ',' + rowTime(1));
    ok('drag marks the day dirty and enables the buttons',
      A.state.planDirty[DAY] && !document.getElementById('plan-save').disabled &&
      !document.getElementById('plan-submit').disabled);

    /* switch auto adjust on: the day re-spaces from the current order */
    var autoBox = document.querySelector('#planner-container .plan-auto input');
    autoBox.checked = true;
    autoBox.dispatchEvent(new Event('change'));
    ok('auto on — out-of-order trips are pushed to when their buses can be there',
      rowTime(0) === '0820' && rowTime(1) === '0850' && rowTime(2) === '0905' &&
      document.querySelectorAll('#planner-container .plan-row.plan-moved').length === 2,
      rowTime(0) + ',' + rowTime(1) + ',' + rowTime(2) + ' moved=' +
      document.querySelectorAll('#planner-container .plan-row.plan-moved').length);

    A.planSaveDraft();
    ok('Save draft stores order+times+auto with the month',
      !!A.state.busPlan[DAY] && A.state.busPlan[DAY].order.length === 5 &&
      A.state.busPlan[DAY].auto === true && A.state.busPlan[DAY].times[rowId(1)] === '0850',
      JSON.stringify(A.state.busPlan));
    ok('draft silences the dirty flag and buttons flip',
      !A.state.planDirty[DAY] && document.getElementById('plan-save').disabled &&
      !document.getElementById('plan-submit').disabled);
    A.flushSave();
    ok('draft save lands in the history trail',
      /Bus plan draft saved/.test((A.state.history[0] || {}).text || ''),
      JSON.stringify((A.state.history[0] || {}).text || ''));
    ok('schedule untouched by the draft — TL still says 0820',
      A.tlText().indexOf('0820 MTL - RHC 4 BUSES') > -1);

    /* reload simulation: rebuild the planner state from the draft */
    A.state.planOrder = {}; A.state.planTimes = {}; A.state.planAuto = {}; A.state.planDirty = {};
    A.renderPlanner();
    ok('draft survives a reload and restores order, times and the toggle',
      rowTime(1) === '0850' &&
      document.querySelector('#planner-container .plan-auto input').checked,
      rowTime(1));

    /* submit writes the plan into the schedule */
    A.planSubmit();
    var first = A.state.entries.filter(function (e) { return e.activity === 'FIRST'; })[0];
    var second = A.state.entries.filter(function (e) { return e.activity === 'SECOND'; })[0];
    ok('Submit retimed the pushed trip to 0850',
      !!first && first.timeStart === '0850' && first.edited, first && first.timeStart);
    ok('the kept trip kept its entered time', !!second && second.timeStart === '0820',
      second && second.timeStart);
    ok('Submit rewrote the raw text of the trip', /^0850 MTL - RHC/.test(first.rawText || ''),
      first.rawText);
    ok('Submit rewrote the Troop-lift line text',
      A.tlText().indexOf('0850 MTL - RHC 4 BUSES (4TH FIRST)') > -1, A.tlText());
    ok('Submit cleared drafts, dirty flags and the toggles',
      !A.state.busPlan[DAY] && !A.state.planDirty[DAY] &&
      !document.querySelector('#planner-container .plan-auto input').checked);
    ok('history says so',
      /Bus plan submitted — 2 trips retimed/.test((A.state.history[0] || {}).text || ''),
      JSON.stringify((A.state.history[0] || {}).text || ''));

    /* discard throws away working changes and any saved draft */
    autoBox = document.querySelector('#planner-container .plan-auto input');
    autoBox.checked = true;
    autoBox.dispatchEvent(new Event('change'));
    A.planMove(DAY, rowId(1), rowId(0));
    A.planSaveDraft();
    A.planMove(DAY, rowId(1), rowId(0));
    ok('second drag re-marks the day dirty', !!A.state.planDirty[DAY]);
    A.planDiscard();
    ok('Discard clears drafts, toggles and working changes',
      !A.state.busPlan[DAY] && !A.state.planDirty[DAY] &&
      !document.querySelector('#planner-container .plan-auto input').checked &&
      rowTime(0) === '0820' && rowTime(1) === '0850',
      rowTime(0) + ',' + rowTime(1) + ' draft=' + JSON.stringify(A.state.busPlan));

    localStorage.clear();
  } catch (e) {
    failures++;
    out.push('CRASH(B) ' + (e && e.stack || e));
  }

  /* ---------- part C: saved-record shape validation ---------- */
  try {
    var V = A.validateSaved;
    var good = V({ v: 3, updatedAt: 'x', entries: [{ id: 't1' }], tlLines: [{ kind: 'line', text: 'y' }],
                   skipped: [{ row: 1 }], history: [{ at: 'a', src: 'edit', text: 'b' }],
                   busPlan: { '2026-11-23': { order: ['t1'], times: { t1: '0850' }, auto: true } } });
    ok('a well-formed record passes through intact',
      !!good && good.entries.length === 1 && good.tlLines.length === 1 && good.skipped.length === 1 &&
      good.history.length === 1 && good.busPlan['2026-11-23'].auto === true &&
      good.busPlan['2026-11-23'].times.t1 === '0850');

    var dirty = V({
      v: 3,
      entries: [{ id: 't1' }, null, 'junk', 42, { nope: 1 }, { id: '' }, { id: 'i2' }],
      tlLines: [{ kind: 'line' }, { kind: 'weird' }, 'x', null, { kind: 'date', date: '2026-11-23' }],
      skipped: [{ row: 1 }, 'bad', 7],
      history: [{ text: 'ok' }, { noText: 1 }, 'junk', null],
      busPlan: {
        '2026-11-23': { order: ['t1', null, 'i2'], times: { t1: '0850', bad: '8:5', t9: 'TBC' }, auto: 1 },
        'not-a-day': { order: ['t1'] },
        '2026-11-24': { order: [] },                     // empty order → dropped
        '2026-11-25': null
      }
    });
    ok('malformed entries are dropped, well-formed ones kept',
      dirty.entries.length === 2 && dirty.entries[0].id === 't1' && dirty.entries[1].id === 'i2',
      JSON.stringify(dirty.entries));
    ok('tlLines keeps only known kinds', dirty.tlLines.length === 2 &&
      dirty.tlLines[0].kind === 'line' && dirty.tlLines[1].kind === 'date');
    ok('skipped and history are filtered the same way',
      dirty.skipped.length === 1 && dirty.history.length === 1 && dirty.history[0].text === 'ok');
    ok('busPlan: bad day keys, empty orders and junk times are stripped',
      Object.keys(dirty.busPlan).length === 1 &&
      JSON.stringify(dirty.busPlan['2026-11-23'].order) === '["t1","i2"]' &&
      dirty.busPlan['2026-11-23'].times.t1 === '0850' &&
      dirty.busPlan['2026-11-23'].times.t9 === 'TBC' &&
      !('bad' in dirty.busPlan['2026-11-23'].times) &&
      dirty.busPlan['2026-11-23'].auto === true,
      JSON.stringify(dirty.busPlan));
    ok('an empty entries list means no edits, garbage in / null out',
      V({ entries: [{ id: 't1' }] }).hasEdits === true &&
      V({ entries: [] }).hasEdits === false &&
      V(null) === null && V('x') === null && V([]) === null && V({}) !== null);

    /* readLocal goes through the same gate */
    localStorage.setItem('tcrs:v3:s4:11-2026', JSON.stringify({
      v: 3, updatedAt: 'z', entries: [{ id: 't1' }, { corrupt: true }],
      tlLines: [], skipped: [], history: [], busPlan: {}
    }));
    var rl = A.readLocal('11-2026');
    ok('readLocal validates — corrupt entries dropped before they reach state',
      !!rl && rl.entries.length === 1 && rl.entries[0].id === 't1' && rl.hasEdits === true,
      JSON.stringify(rl && rl.entries));
    localStorage.clear();
  } catch (e) {
    failures++;
    out.push('CRASH(C) ' + (e && e.stack || e));
  }

  /* ---------- part D: columnar TL survives the live-sheet text round-trip */
  try {
    function buildColTl() {
      var wb = new ExcelJS.Workbook();
      var ws = wb.addWorksheet('DEC 26 TL');
      ws.getRow(1).getCell(11).value = 'DECEMBER-2026';
      ws.getRow(3).values = [, 'DATE', 'DAY', 'DAY OF WEEK', 'TIME', 'TIME GAP (H:MM)', 'COY/UNIT', 'PURPOSE', 'PICK-UP POINT TO DROP-OFF POINT', 'NO. OF BUSES', 'REMARKS'];
      ws.getRow(4).values = [, { formula: 'B4&"-"&$K$1', result: NaN }, 1, 'Tuesday', '0630', , '1ST', 'COMD VETT', 'RHC - MTL', 4, '4x 5-TON'];
      ws.getRow(5).values = [, { formula: 'B5&"-"&$K$1', result: NaN }, 2, 'Wednesday', '1700', , '5TH', 'GX II', 'MTL - RHC', 2, ''];
      return wb;
    }
    async function toFileD(wb, name) { return new File([await wb.xlsx.writeBuffer()], name); }
    await A.handleFile(await toFileD(buildColTl(), 'DEC 26 TL.xlsx'), 'tl');
    var tlt = A.state.entries.filter(function (e) { return e.source === 'TROOPLIFT'; });
    ok('columnar TL loaded into the app with dates', tlt.length === 3 &&
      tlt[0].date === '2026-12-01' && tlt[2].date === '2026-12-02',
      JSON.stringify(tlt.map(function (e) { return [e.date, e.timeStart]; })));
    var dated = A.state.tlLines.filter(function (l) { return l.kind === 'date'; }).length;
    ok('TL lines carry date headings (2 days)', dated === 2, dated);

    /* the exact user bug: live-sheet text → Update must keep every date */
    var txt = A.tlText();
    var before = {};
    tlt.forEach(function (e) { before[e.id] = e.date; });
    var resT = A.applyTLText(txt);
    var after = A.state.entries.filter(function (e) { return e.source === 'TROOPLIFT'; });
    ok('text round-trip keeps every trip date', after.length === 3 &&
      after.every(function (e) { return e.date && (before[e.id] ? before[e.id] === e.date : true); }) &&
      after[0].date === '2026-12-01' && after[after.length - 1].date === '2026-12-02',
      JSON.stringify(resT) + ' ' + JSON.stringify(after.map(function (e) { return [e.date, e.timeStart, e.vehicleType]; })));
    ok('tonner row survives the round-trip',
      after.some(function (e) { return e.vehicleType === 'TONNERS' && e.qty === 4 && e.timeStart === '0630'; }));
  } catch (e) {
    failures++;
    out.push('CRASH(D) ' + (e && e.stack || e));
  }

  /* ---------- part E: a pre-fix saved workspace heals on reopen ---------- */
  try {
    /* simulate the user's December workspace saved before the date fix:
       every Troop Lift entry lost its date and the live lines lost their
       date headings — then the month is reopened */
    var bad = [];
    A.state.entries.forEach(function (e) {
      var c = JSON.parse(JSON.stringify(e));
      if (e.source === 'TROOPLIFT') { delete c.date; delete c.eDate; }
      bad.push(c);
    });
    var badLines = A.state.tlLines.filter(function (l) { return l.kind !== 'date'; });
    badLines.forEach(function (l) { if (l.date) l.date = 'NaN-NaN-NaN'; });
    localStorage.setItem('tcrs:v3:s4:12-2026', JSON.stringify({
      v: 3, updatedAt: 'z', entries: bad, tlLines: badLines,
      skipped: [], history: [], busPlan: {}
    }));
    A.maybeCombine();
    var healedE = A.state.entries.filter(function (e) { return e.source === 'TROOPLIFT'; });
    ok('saved date-less TL entries are repaired on reopen', healedE.length >= 3 &&
      healedE.every(function (e) { return /^\d{4}-\d{2}-\d{2}$/.test(e.date || ''); }),
      JSON.stringify(healedE.map(function (e) { return [e.id, e.date]; })));
    var headsE = A.state.tlLines.filter(function (l) { return l.kind === 'date'; }).length;
    ok('date headings are re-inserted into the live lines', headsE >= 2, headsE);
    var planDaysE = Object.keys((function () {   // planner sees the healed days
      var d = {};
      A.state.entries.forEach(function (e) {
        if (e.kind !== 'bus' || !/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) return;
        d[e.date] = 1;
      });
      return d;
    })());
    ok('the bus planner finds trips again (2 days)', planDaysE.length === 2,
      planDaysE.join(','));
    A.flushSave(true);
    var persist = JSON.parse(localStorage.getItem('tcrs:v3:s4:12-2026') || 'null');
    var pTl = (persist && persist.entries || []).filter(function (e) { return e.source === 'TROOPLIFT'; });
    ok('the healed data is persisted', !!persist && pTl.length >= 3 &&
      pTl.every(function (e) { return /^\d{4}-\d{2}-\d{2}$/.test(e.date || ''); }),
      pTl.length);
    localStorage.clear();
  } catch (e) {
    failures++;
    out.push('CRASH(E) ' + (e && e.stack || e));
  }

  /* ---------- part F: a newly added TL workbook syncs the lines ---------- */
  try {
    function buildColTlF(extraRow) {
      var wb = new ExcelJS.Workbook();
      var ws = wb.addWorksheet('DEC 26 TL');
      ws.getRow(1).getCell(11).value = 'DECEMBER-2026';
      ws.getRow(3).values = [, 'DATE', 'DAY', 'DAY OF WEEK', 'TIME', 'TIME GAP (H:MM)', 'COY/UNIT', 'PURPOSE', 'PICK-UP POINT TO DROP-OFF POINT', 'NO. OF BUSES', 'REMARKS'];
      ws.getRow(4).values = [, { formula: 'B4&"-"&$K$1', result: NaN }, 1, 'Tuesday', '0630', , '1ST', 'COMD VETT', 'RHC - MTL', 4, '4x 5-TON'];
      ws.getRow(5).values = [, { formula: 'B5&"-"&$K$1', result: NaN }, 2, 'Wednesday', '1700', , '5TH', 'GX II', 'MTL - RHC', 2, ''];
      if (extraRow) ws.getRow(6).values = [, { formula: 'B6&"-"&$K$1', result: NaN }, 2, 'Wednesday', '0800', , '2ND', 'GX RTU', 'MTL - RHC', 3, ''];
      return wb;
    }
    async function toFileF(wb, name) { return new File([await wb.xlsx.writeBuffer()], name); }

    /* saved workspace holding a stale TL row (user edited days ago) */
    var curE = A.state.entries.slice();
    var nIcrf = curE.filter(function (e) { return e.source !== 'TROOPLIFT'; }).length;
    var stale = JSON.parse(JSON.stringify(curE.filter(function (e) { return e.source === 'TROOPLIFT'; })[0]));
    stale.id = 't999'; stale.timeStart = '0559'; stale.rawText = '0559 OLD - OLD BUSES (1ST STALE)';
    delete stale.date;
    localStorage.setItem('tcrs:v3:s4:12-2026', JSON.stringify({
      v: 3, updatedAt: 'z', entries: curE.concat([stale]),
      tlLines: A.state.tlLines, skipped: [], history: [], busPlan: {}
    }));

    /* add a *changed* TL workbook — an extra movement — the lines must
       sync with it: the new row appears, the stale row is gone */
    await A.handleFile(await toFileF(buildColTlF(true), 'DEC 26 TL v2.xlsx'), 'tl');
    var tlF = A.state.entries.filter(function (e) { return e.source === 'TROOPLIFT'; });
    ok('a changed TL workbook syncs: new row in, stale row out', tlF.length === 4 &&
      tlF.some(function (e) { return e.timeStart === '0800' && e.coys[0] === '2ND'; }) &&
      !tlF.some(function (e) { return e.timeStart === '0559'; }),
      JSON.stringify(tlF.map(function (e) { return [e.timeStart, e.coys[0]]; })));
    ok('all synced TL trips are dated',
      tlF.every(function (e) { return /^\d{4}-\d{2}-\d{2}$/.test(e.date || ''); }));
    ok('ICRF rows survive the TL sync',
      A.state.entries.filter(function (e) { return e.source !== 'TROOPLIFT'; }).length === nIcrf,
      nIcrf);
    ok('live lines carry the workbook date headings after sync',
      A.state.tlLines.filter(function (l) { return l.kind === 'date'; }).length >= 2);

    /* an identical re-drop must NOT clobber user edits: save an edit,
       re-drop the same file, the edit stays. One buffer reused — a fresh
       writeBuffer would differ (ExcelJS stamps a creation timestamp). */
    A.flushSave(true);
    var e0 = A.state.entries.filter(function (e) { return e.source === 'TROOPLIFT'; })[0];
    e0.timeStart = '1123'; e0.edited = true;
    A.saveStore(true); A.flushSave(true);
    var sameBuf = await buildColTlF(true).xlsx.writeBuffer();
    await A.handleFile(new File([sameBuf], 'DEC 26 TL v2.xlsx'), 'tl');
    var e0b = A.state.entries.filter(function (e) { return e.source === 'TROOPLIFT' && e.id === e0.id; })[0] ||
      A.state.entries.filter(function (e) { return e.source === 'TROOPLIFT'; })[0];
    ok('an identical re-drop keeps the saved lines (edits win)', e0b.timeStart === '1123',
      e0b.timeStart);
    localStorage.clear();
  } catch (e) {
    failures++;
    out.push('CRASH(F) ' + (e && e.stack || e));
  }
  log();
  document.title = failures ? 'PLAN FAILED' : 'PLAN OK';
})();
</script></body></html>
