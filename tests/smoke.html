<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>UI smoke</title>
<script src="../vendor/exceljs.min.js"></script>
<script src="../parser.js"></script>
</head><body>
<pre id="smoke-out">starting…</pre>
<script>
/* UI smoke test: reuses index.html's real DOM + app.js in this page, then
 - verifies the redesigned tabs, stats, schedule views
 - makes a LIVE SHEET edit and checks it flows into the schedule view + export */
(async function () {
  var out = [], failures = 0;
  function ok(name, cond, extra) {
    out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : '  [' + (extra === undefined ? '' : extra) + ']'));
    if (!cond) failures++;
  }
  function log() { document.getElementById('smoke-out').textContent = out.join('\n'); }
  function text(els) {
    return Array.prototype.map.call(els, function (t) { return t.textContent; });
  }

  try {
    var html = await fetch('../index.html').then(function (r) { return r.text(); });
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var styles = await fetch('../styles.css').then(function (r) { return r.text(); });
    var st = document.createElement('style'); st.textContent = styles; document.head.appendChild(st);
    document.body.appendChild(doc.querySelector('header'));
    document.body.appendChild(doc.querySelector('main'));
    document.body.appendChild(doc.querySelector('.toast'));
    var bg = document.createElement('div'); bg.className = 'bgwash'; document.body.appendChild(bg);

    var appSrc = await fetch('../app.js').then(function (r) { return r.text(); });
    eval(appSrc);
    var sheetSrc = await fetch('../sheet.js').then(function (r) { return r.text(); });
    eval.call({} ,sheetSrc);   // defines window.TCRSSheet
    var A = window.__tcrs;

    /* ---------- load samples ---------- */
    var [a, b] = await Promise.all([
      fetch('../samples/ICRF.xlsx').then(function (r) { return r.arrayBuffer(); }),
      fetch('../samples/Troop Lift Sample.xlsx').then(function (r) { return r.arrayBuffer(); })
    ]);
    var wbA = new ExcelJS.Workbook(); await wbA.xlsx.load(a);
    var wbB = new ExcelJS.Workbook(); await wbB.xlsx.load(b);
    A.state.icrfWb = wbA; A.state.icrfName = 'ICRF.xlsx';
    A.state.tlWb = wbB; A.state.tlName = 'troop lift.xlsx';
    A.maybeCombine();

    ok('model built', !!A.state.model, 'no model');
    ok('stats populated', !!document.querySelector('#statsbar .stat .v'), 'empty');
    ok('month banner title', document.getElementById('mb-title').textContent.indexOf('NOVEMBER 2026') > -1,
      document.getElementById('mb-title').textContent);
    ok('6 company chips', document.querySelectorAll('#coy-chips .chip').length === 6,
      document.querySelectorAll('#coy-chips .chip').length);
    var dateGroups = document.querySelectorAll('#content .group');
    ok('by-date groups rendered', dateGroups.length >= 20, dateGroups.length);
    ok('281 rows in schedule', A.filteredEntries().length === 281, A.filteredEntries().length);
    ok('empty-state hidden after combine', document.getElementById('empty-state').hidden === true);

    /* ---------- tabs ---------- */
    A.setTab('grid');
    ok('body switches to grid mode', document.body.classList.contains('tab-grid'));
    ok('grid mounted with rows', document.querySelectorAll('#sheet-container tbody tr').length >= 260,
      document.querySelectorAll('#sheet-container tbody tr').length);
    A.setTab('schedule');
    ok('back to schedule', document.getElementById('panel-schedule').style.display !== 'none');

    /* ---------- LIVE SHEET EDIT ---------- */
    var target = A.filteredEntries()[1];           // any entry
    var before = target.activity;
    var res = A.commitEntry(target.id, 'activity', 'EDITED XYZ');
    ok('commit ok', res && res.ok, JSON.stringify(res));
    var shown = text(document.querySelectorAll('#content table.mov .act')).indexOf('EDITED XYZ') > -1;
    ok('schedule tab reflects the edit', shown, 'not found in day view');
    var row = document.querySelector('#sheet-container tr[data-id="' + target.id + '"]');
    ok('live sheet rendered', true);
    var stored = JSON.parse(localStorage.getItem(Object.keys(localStorage).filter(function (k) { return k.indexOf('tcrs:v2:') === 0; })[0] || '{}'));
    ok('edits auto-saved', stored && stored.entries.some(function (e) { return e.id === target.id && e.activity === 'EDITED XYZ'; }), 'missing');
    ok('edited flag set', !!findE(stored.entries, target.id).edited, 'no flag');
    restore = null;

    // reject invalid date
    var bad = A.commitEntry(target.id, 'date', '31/13/2026');
    ok('invalid date rejected', !bad.ok, JSON.stringify(bad));

    // time normalize
    var t2 = A.commitEntry(target.id, 'timeStart', '7:05');
    ok('time normalized to 0705', findE(A.state.entries, target.id).timeStart === '0705', findE(A.state.entries, target.id).timeStart);

    // add + delete
    var n0 = A.state.entries.length;
    A.addRow();
    var manual = A.state.entries.filter(function (e) { return e.source === 'MANUAL'; });
    ok('add row works', A.state.entries.length === n0 + 1 && manual.length === 1, manual.length);
    A.delRow(manual[0].id);
    ok('delete works', A.state.entries.length === n0, A.state.entries.length);

    // duplicate
    A.dupRow(target.id);
    var dups = A.state.entries.filter(function (e) { return e.activity === 'EDITED XYZ'; });
    ok('duplicate works', dups.length === 2, dups.length);
    A.state.entries.splice(A.state.entries.indexOf(dups[1]), 1);
    A.refresh();

    /* ---------- POC toggle ---------- */
    A.state.poc = false; A.drawView();
    var ths = text(document.querySelectorAll('#content thead th'));
    ok('POC header absent when toggled off', ths.indexOf('POC / Contact') === -1, ths.join(','));
    A.state.poc = true; A.drawView();

    A.state.onlyS4 = false; A.refresh();
    ok('onlyS4 off shows all TL lines', A.filteredEntries().length > 281, A.filteredEntries().length);
    A.state.onlyS4 = true; A.refresh();

    /* ---------- company view ---------- */
    A.state.view = 'coy'; A.drawView();
    ok('by-company groups', document.querySelectorAll('#content .group').length >= 5,
      document.querySelectorAll('#content .group').length);
    A.state.view = 'date'; A.drawView();

    /* ---------- export uses edited data ---------- */
    URL.createObjectURL = (function (real) {
      return function (blob) { URL.createObjectURL.__blob = blob; return real.call(URL, blob); };
    })(URL.createObjectURL);
    await A.exportXlsx();
    var buf = await URL.createObjectURL.__blob.arrayBuffer();
    var outWb = new ExcelJS.Workbook(); await outWb.xlsx.load(buf);
    var names = outWb.worksheets.map(function (w) { return w.name; });
    ok('export sheets = By Date | By Company | Data notes',
      names.join('|') === 'By Date|By Company|Data notes', names.join('|'));
    var ws1 = outWb.worksheets[0];
    var foundEdit = false;
    ws1.eachRow(function (row) {
      row.eachCell(function (c) {
        if (typeof c.value === 'string' && c.value === 'EDITED XYZ') foundEdit = true;
      });
    });
    ok('export includes the live-sheet edit', foundEdit, 'EDITED XYZ missing from xlsx');
    var genNote = ws1.getRow(2).getCell(1).value;
    ok('export notes mention manual adjustments', /manually adjusted/.test(String(genNote)), String(genNote));

    /* ---------- reset edits restores parsed data ---------- */
    A.resetEdits();
    var c = A.filteredEntries().filter(function (e) { return e.id === target.id; })[0];
    ok('reset restores original activity', c.activity !== 'EDITED XYZ', c.activity);

  } catch (e) {
    failures++;
    out.push('CRASH ' + (e && e.stack || e));
  }
  log();
  document.title = failures ? 'SMOKE FAILED' : 'SMOKE OK';

  function findE(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
})();
</script></body></html>
