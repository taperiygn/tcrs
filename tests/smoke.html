<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>UI smoke</title>
<style>.toast,.bgwash{display:none}body{background:#fff;margin:0}</style>
<link rel="stylesheet" href="../styles.css">
<script src="../vendor/exceljs.min.js"></script>
<script src="../parser.js"></script>
</head><body>
<pre id="smoke-out">starting…</pre>
<script>
/* UI smoke: loads the real app.js against index.html's DOM and exercises
   the redesigned LIVE SHEET (ICRF template grid + Troop-lift bulk text
   editor), the schedule views, persistence and the styled export. */
(async function () {
  var out = [], failures = 0;
  function ok(name, cond, extra) {
    out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : '  [' + (extra === undefined ? '' : extra) + ']'));
    if (!cond) failures++;
  }
  function log() { document.getElementById('smoke-out').textContent = out.join('\n'); }
  function txt(el) { return el ? el.textContent : ''; }

  try {
    var html = await fetch('../index.html').then(function (r) { return r.text(); });
    var doc = new DOMParser().parseFromString(html, 'text/html');
    document.body.appendChild(doc.querySelector('header'));
    document.body.appendChild(doc.querySelector('main'));
    document.body.appendChild(doc.querySelector('.toast'));

    eval(await fetch('../app.js').then(function (r) { return r.text(); }));
    eval(await fetch('../sheet.js').then(function (r) { return r.text(); }));
    A = window.__tcrs;

    /* ---------- load samples ---------- */
    var [a, b] = await Promise.all([
      fetch('../samples/ICRF.xlsx').then(function (r) { return r.arrayBuffer(); }),
      fetch('../samples/Troop Lift Sample.xlsx').then(function (r) { return r.arrayBuffer(); })
    ]);
    var wbA = new ExcelJS.Workbook(); await wbA.xlsx.load(a);
    var wbB = new ExcelJS.Workbook(); await wbB.xlsx.load(b);
    A.state.icrfWb = wbA; A.state.icrfName = 'ICRF.xlsx';
    A.state.tlWb = wbB; A.state.tlName = 'troop lift.xlsx';
    A.maybeCombine();
    localStorage.clear();

    ok('model built', !!A.state.model, 'no model');
    ok('stats populated', !!document.querySelector('#statsbar .stat .v'), 'empty');
    ok('month banner title', txt(document.getElementById('mb-title')).indexOf('NOVEMBER 2026') > -1,
      txt(document.getElementById('mb-title')));
    ok('roster chips: 7 companies + SCHWIDE (inactive 2ND/3RD shown)',
      document.querySelectorAll('#coy-chips .chip').length === 8 &&
      !!document.querySelector('#coy-chips .chip[data-coy="2ND"]') &&
      !!document.querySelector('#coy-chips .chip[data-coy="3RD"]'),
      document.querySelectorAll('#coy-chips .chip').length);
    ok('school menu lists 4 schools', document.querySelectorAll('#school-menu button').length === 4);
    ok('default profile is School 4', A.state.school === 4 && txt(document.querySelector('.smark')) === 'S4');
    ok('by-date groups rendered', document.querySelectorAll('#content .group').length >= 20,
      document.querySelectorAll('#content .group').length);
    ok('281 rows in schedule', A.filteredEntries().length === 281, A.filteredEntries().length);
    ok('empty-state hidden after combine', document.getElementById('empty-state').hidden === true);

    /* ---------- live sheet opens with two source tabs ---------- */
    A.setTab('grid');
    A.setSrc('icrf');
    ok('ICRF subtab on by default', document.getElementById('btn-src-icrf').classList.contains('on'));
    var icrfRows = document.querySelectorAll('#icrf-container tbody tr');
    ok('ICRF grid has 91 rows (86 entries + 5 skipped)', icrfRows.length === 91, icrfRows.length);

    /* ---------- hover-insert row (0.25s) ---------- */
    var nBefore = A.state.entries.length;
    var idsBefore = A.state.entries.map(function (e) { return e.id; });
    var hoverTr = document.querySelector('#icrf-container tbody tr[data-id]');
    var hoverId = hoverTr.dataset.id;
    hoverTr.querySelector('td[data-key]').dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
    await new Promise(function (r) { setTimeout(r, 450); });
    var menu = document.querySelector('#icrf-container .hover-menu');
    ok('hovering 0.25s opens the row menu under the cursor', !!menu &&
      menu.querySelector('button[data-act="insert"]') && menu.querySelector('button[data-act="dup"]') &&
      menu.querySelector('button[data-act="del"]'),
      menu ? 'acts=' + [].map.call(menu.querySelectorAll('button'), function (bt) { return bt.dataset.act; }).join() : 'no menu after 0.45s');
    menu.querySelector('button[data-act="insert"]').click();
    var added = A.state.entries.filter(function (e) { return idsBefore.indexOf(e.id) === -1; });
    var trs = [].slice.call(document.querySelectorAll('#icrf-container tbody tr:not(.sheet-empty)'));
    var iHover = trs.indexOf(trs.filter(function (t) { return t.dataset.id === hoverId; })[0]);
    var iNew = trs.indexOf(trs.filter(function (t) { return added[0] && t.dataset.id === added[0].id; })[0]);
    ok('menu: add-row-below inserts a blank row directly below the hovered one',
      A.state.entries.length === nBefore + 1 && added.length === 1 &&
      added[0].source === 'MANUAL' && added[0].activity === '' && iNew === iHover + 1,
      'n=' + A.state.entries.length + ' iHover=' + iHover + ' iNew=' + iNew);
    A.state.entries.pop();               // keep later counts intact
    A.refresh();
    ok('ICRF rows show template text in the first cell',
      Array.prototype.some.call(document.querySelectorAll('#icrf-container td.c-colA'),
        function (td) { return txt(td).indexOf('SCH 4 - ') === 0; }),
      txt(document.querySelector('#icrf-container td.c-colA')));
    var skipRow = document.querySelector('#icrf-container tr.row-skip');
    ok('skipped rows rendered only with an editable first cell', !!skipRow);

    /* ---------- ICRF edits ---------- */
    var i7 = A.state.entries.filter(function (e) { return e.id === 'i7'; })[0];
    ok('i7 exists', !!i7);
    var r1 = A.commitICRF('i7', 'from', 'RHC DEPOT');
    ok('ICRF free-text cell commits', r1.ok, JSON.stringify(r1));
    ok('from updated', i7.from === 'RHC DEPOT', i7.from);

    var r2 = A.commitICRF('i7', 'colA', 'SCH 4 - 6TH / 7TH COY - ICRF EDIT XYZ');
    ok('colA re-parses coy+activity', r2.ok && i7.activity === 'ICRF EDIT XYZ' &&
      i7.coys.join(',') === '6TH,7TH', JSON.stringify({ r: r2, a: i7.activity, c: i7.coys }));
    var bad = A.commitICRF('i7', 'colA', 'GARBAGE CELL');
    ok('bad colA rejected with a reason', !bad.ok, JSON.stringify(bad));

    var i8 = A.state.entries.filter(function (e) { return e.id === 'i8'; })[0];
    ok('i8 span info', !!i8 && i8.dayDiff === 3, i8 && i8.dayDiff);
    var r3 = A.commitICRF('i8', 'sdate', '03/11/2026');
    ok('date edit shifts multi-day span', r3.ok && i8.date === '2026-11-03' &&
      i8.eDate === '2026-11-06' && i8.dayDiff === 3,
      JSON.stringify(i8 && [i8.date, i8.eDate, i8.dayDiff]));

    var t = A.commitICRF('i7', 'stime', '07:05');
    ok('time normalized', i7.timeStart === '0705', i7.timeStart);

    /* skip-row rescue */
    var skipBefore = A.state.skipped.length;
    var rs = A.commitICRF('s0', 'colA', 'SCH 4 - 6TH COY - RESCUED ROW');
    ok('skipped row rescued into schedule', rs.ok && A.state.skipped.length === skipBefore - 1,
      JSON.stringify({ r: rs, n: A.state.skipped.length }));
    var rescued = A.state.entries.filter(function (e) { return e.activity === 'RESCUED ROW'; })[0];
    ok('rescued row registered', !!rescued && rescued.coys.join(',') === '6TH', rescued && rescued.id);

    A.flushSave();
    ok('carried edits auto-saved to storage v3', (function () {
      var k = Object.keys(localStorage).filter(function (k0) { return k0.indexOf('tcrs:v3:') === 0; })[0];
      var d = k && JSON.parse(localStorage.getItem(k) || '{}');
      return d && d.v === 3 && Array.isArray(d.tlLines) && d.tlLines.length > 400;
    })(), Object.keys(localStorage).join(','));

    /* ---------- scheduling still reflects ICRF edits ---------- */
    var shown = Array.prototype.some.call(document.querySelectorAll('#content .act'),
      function (n) { return n.textContent === 'ICRF EDIT XYZ'; });
    ok('schedule is NOT rebuilt while editing in the live sheet', !shown && A.state.scheduleStale === true);
    A.setTab('schedule');
    shown = Array.prototype.some.call(document.querySelectorAll('#content .act'),
      function (n) { return n.textContent === 'ICRF EDIT XYZ'; });
    ok('schedule reflects the ICRF edit after switching tabs', shown && !A.state.scheduleStale, 'not found');
    A.setTab('grid');

    /* ---------- Troop-lift bulk text editor ---------- */
    A.setSrc('tl');
    var days = 0;
    A.state.tlLines.forEach(function (l) { if (l.kind === 'date') days++; });
    var ta = document.querySelector('#tl-container .tl-editor');
    ok('TL editor holds the month as one text block',
      !!ta && ta.value.indexOf('NOVEMBER') === 0 && ta.value.split('\n').length > 300,
      ta ? ta.value.length : 'no textarea');
    var searchBox = document.getElementById('grid-searchwrap');
    ok('search hidden on the TL text editor', searchBox.style.display === 'none', searchBox.style.display);

    /* add a movement at the end, press Update, verify re-parse → schedule */
    var n0 = A.state.entries.length;
    ta.value = ta.value + '\n0915 MTL - RHC 2 BUSES (7TH TL TEST EDIT)';
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    document.querySelector('#tl-container .tl-apply').click();
    var added = A.state.entries.filter(function (e) { return e.activity === 'TL TEST EDIT'; })[0];
    ok('Update parses the edited text into an entry', !!added && added.timeStart === '0915' &&
      added.qty === 2 && added.kind === 'bus', added && JSON.stringify(added));
    ok('Update reports what it parsed', txt(document.querySelector('#tl-container .tl-editor-status')).length > 5,
      txt(document.querySelector('#tl-container .tl-editor-status')));
    A.setTab('schedule');
    shown = Array.prototype.some.call(document.querySelectorAll('#content .act'),
      function (n) { return n.textContent === 'TL TEST EDIT'; });
    A.setTab('grid');
    ok('schedule view reflects the TL text after switching tabs', shown, 'not found');

    /* an unrecognized line is kept and marked, and Update removes nothing else */
    ta.value = ta.value + '\nnot a movement line';
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    document.querySelector('#tl-container .tl-apply').click();
    var badLine = A.state.tlLines.filter(function (l) { return l.status === 'unparsed'; })[0];
    ok('unrecognized line kept and marked', !!badLine && A.state.entries.filter(function (e) { return e.activity === 'TL TEST EDIT'; }).length === 1,
      JSON.stringify(A.state.tlLines.filter(function (l) { return l.status === 'unparsed'; })));

    /* deleting a line from the text removes its entry */
    var cleaned = ta.value.split('\n').filter(function (l) {
      return l.indexOf('not a movement line') === -1 && l.indexOf('TL TEST EDIT') === -1;
    }).join('\n');
    ta.value = cleaned;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    document.querySelector('#tl-container .tl-apply').click();
    ok('removed lines drop their entries',
      A.state.entries.length === n0 && !A.state.entries.some(function (e) { return e.activity === 'TL TEST EDIT'; }),
      A.state.entries.length - n0);

    /* real UI edit in the ICRF grid leaves exactly one row per id */
    A.setSrc('icrf');
    var td = document.querySelector('#icrf-container tr[data-id="i9"] td[data-key="from"]');
    td.click(); td.querySelector('input').value = 'ONCE ONLY'; td.querySelector('input').blur();
    var same = A.state.entries.filter(function (e) { return e.id === 'i9'; });
    ok('UI edit never duplicates a row', same.length === 1 && same[0].from === 'ONCE ONLY', same.length);

    /* ---------- reset edits restores parsed data ---------- */
    A.resetEdits();
    ok('reset restores skipped rows', A.state.skipped.length === 5, A.state.skipped.length);
    ok('reset restores original activity',
      findEntryW(A, 'i7').activity !== 'ICRF EDIT XYZ', findEntryW(A, 'i7').activity);
    ok('reset removes manual TL line edits', !A.state.entries.some(function (e) { return e.activity === 'TL TEST EDIT'; }));

    /* ---------- POC toggle ---------- */
    A.state.poc = false; A.drawView();
    var ths = Array.prototype.map.call(document.querySelectorAll('#content thead th'), txt);
    ok('POC header absent when toggled off', ths.indexOf('POC / Contact') === -1, ths.join(','));
    A.state.poc = true; A.drawView();

    A.state.onlyS4 = false; A.refresh();
    ok('onlyS4 off shows all TL entries', A.filteredEntries().length > 281, A.filteredEntries().length);
    A.state.onlyS4 = true; A.refresh();

    /* ---------- company view ---------- */
    A.state.view = 'coy'; A.drawView();
    ok('by-company groups', document.querySelectorAll('#content .group').length >= 5,
      document.querySelectorAll('#content .group').length);
    A.state.view = 'date'; A.drawView();

    /* ---------- export uses edited data ---------- */
    A.commitICRF('i7', 'from', 'RHC DEPOT');   // one edit again after reset
    URL.createObjectURL = (function (real) {
      return function (blob) { URL.createObjectURL.__blob = blob; return real.call(URL, blob); };
    })(URL.createObjectURL);
    await A.exportXlsx();
    var buf = await URL.createObjectURL.__blob.arrayBuffer();
    var outWb = new ExcelJS.Workbook(); await outWb.xlsx.load(buf);
    var names = outWb.worksheets.map(function (w) { return w.name; });
    ok('export sheets = By Date | By Company | Data notes',
      names.join('|') === 'By Date|By Company|Data notes', names.join('|'));
    var foundEdit = false;
    outWb.worksheets[0].eachRow(function (row) {
      row.eachCell(function (c) {
        if (typeof c.value === 'string' && c.value === 'RHC DEPOT') foundEdit = true;
      });
    });
    ok('export includes the live-sheet edit', foundEdit, 'RHC DEPOT missing from xlsx');
    ok('export notes mention manual adjustments',
      /manually adjusted/.test(String(outWb.worksheets[0].getRow(2).getCell(1).value)),
      String(outWb.worksheets[0].getRow(2).getCell(1).value));

    /* ---------- school profiles ---------- */
    await A.setSchool(2);
    ok('switching to School 2 clears the workspace',
      A.state.school === 2 && !A.state.model && document.getElementById('empty-state').hidden === false);
    ok('School 2 texts applied', txt(document.querySelector('.smark')) === 'S2' &&
      txt(document.querySelector('.t1')).indexOf('School 2') === 0 && document.title.indexOf('School 2') > -1,
      txt(document.querySelector('.t1')));
    A.state.icrfWb = wbA; A.state.icrfName = 'ICRF.xlsx';
    A.state.tlWb = wbB; A.state.tlName = 'troop lift.xlsx';
    A.maybeCombine();
    var s2chips = [].map.call(document.querySelectorAll('#coy-chips .chip'), function (c) { return c.dataset.coy; });
    ok('School 2 roster chips H,J,K,L,M,N,O', s2chips.filter(function (c) { return c !== 'SCHWIDE'; }).join('') === 'HJKLMNO', s2chips.join(','));
    ok('School 4 rows are not imported into School 2',
      A.state.entries.every(function (e) { return e.coys.every(function (c) { return c === 'SCHWIDE' || 'HJKLMNO'.indexOf(c) > -1; }); }));
    A.state.entries.push({ id: 'z1', source: 'MANUAL', coys: ['K'], coyLabel: 'K', date: '2026-11-03', eDate: '2026-11-03',
      timeStart: '0800', timeEnd: '', from: 'X', to: 'Y', qty: 1, vehicleType: 'LUV', kind: 'veh', activity: 'T', edited: true });
    A.state.touched = true; A.flushSave();
    ok('School 2 data stored under its own key',
      Object.keys(localStorage).some(function (k) { return /^tcrs:v3:s2:/.test(k); }) &&
      localStorage.getItem('tcrs:v3:s4:11-2026') !== localStorage.getItem('tcrs:v3:s2:11-2026') &&
      localStorage.getItem('tcrs:v3:s4:11-2026').indexOf('"id":"z1"') === -1 &&
      localStorage.getItem('tcrs:v3:s2:11-2026').indexOf('"id":"z1"') > -1,
      Object.keys(localStorage).join(','));
    await A.setSchool(1);
    ok('School 1 starts empty and uses letter roster',
      !A.state.model && A.state.entries.length === 0 && A.state.school === 1);
    await A.setSchool(4);
    ok('back on School 4', A.state.school === 4 && txt(document.querySelector('.smark')) === 'S4');

    /* ---------- sidebar collapse ---------- */
    var railBtn = document.getElementById('rail-toggle');
    railBtn.click();
    ok('sidebar collapses on toggle',
      document.body.classList.contains('rail-collapsed') &&
      getComputedStyle(document.body.querySelector('.rail > :not(#rail-toggle)')).display === 'none',
      'cls=' + document.body.className + ' disp=' +
      getComputedStyle(document.body.querySelector('.rail > :not(#rail-toggle)')).display);
    A.setTab('grid');
    var gtc = getComputedStyle(document.querySelector('.layout')).gridTemplateColumns;
    ok('live sheet keeps full width while collapsed', gtc.split(' ').length === 1, gtc);
    A.setTab('schedule');
    railBtn.click();
    ok('sidebar expands again', !document.body.classList.contains('rail-collapsed') &&
      getComputedStyle(document.body.querySelector('.rail > :not(#rail-toggle)')).display !== 'none',
      'cls=' + document.body.className + ' disp=' +
      getComputedStyle(document.body.querySelector('.rail > :not(#rail-toggle)')).display);
    localStorage.clear();

    /* ---------- blank panel when nothing is parsed ---------- */
    A.state.model = null; A.setTab('grid');
    ok('live sheet shows a blank hint pre-combine',
      document.getElementById('sheet-panel').classList.contains('blank'));
    localStorage.clear();

  } catch (e) {
    failures++;
    out.push('CRASH ' + (e && e.stack || e));
  }
  log();
  document.title = failures ? 'SMOKE FAILED' : 'SMOKE OK';

  function findEntryW(A, id) {
    var x = null;
    A.state.entries.forEach(function (e) { if (e.id === id) x = e; });
    return x;
  }
})();
</script></body></html>
